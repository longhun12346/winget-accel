[package]
name = "winget-accel"
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
description = "用 PAC 把 GitHub 下载域名指到本机，再由本机改写为加速器 URL"
license = "MIT"

[dependencies]
# 依赖策略见 ADR-012：**不设数量上限**，但每个直接依赖都必须说清"为什么不能用标准库
# 或已有依赖"。本工具要求用户信任它改写下载流量，供应链面越大攻击收益越高，
# 所以控制审计面靠的是逐条理由，不是数字——数量上限曾被随手改过一次，不承载真实约束。
# HTTP 分帧、CONNECT 升级和异步网络交给 Hyper/Tokio，不再维护协议解析器。
# 不叠加 axum/reqwest；不引入 native-tls/openssl 或 git2/libgit2-sys。
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls 关掉默认的 aws-lc-rs：它在 Windows 上要 cmake + NASM，构建门槛太高。
# 统一用 ring，rcgen 也指向同一个后端，避免两套加密实现。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# rcgen 0.14 才有 `Issuer::from_ca_cert_pem`：能把磁盘上的 CA 重新当成签发者。
# 0.13 做不到，会导致每次重启换一张 CA、用户必须重新信任。
# `x509-parser` 是该方法的前置 feature（它要解析 PEM 里的证书）。
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# 上游（加速器）证书校验需要根证书；纯数据 crate，无传递依赖，无 C 代码。
# 这是对 ADR-012 允许清单的一处新增，理由见 docs/design.md。
webpki-roots = "1"
# Win32 API：证书存储、Unicode PAC 注册表读写、WinINet 刷新通知，以及独立看门狗进程标志。
# 用它替代原先调 powershell.exe 的做法（见 ADR-012 第 3 次修订）。
# 与 Tokio/mio/socket2 共用 0.61，避免重复绑定和 windows-targets 依赖树。
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_Networking_WinInet"] }

# 解析证书的 NotAfter：windows-sys 没有导出 CERT_NOT_AFTER_FILETIME_PROP_ID，
# 与其编一个常量，不如用成熟解析器。它已是 rcgen 的传递依赖（^0.18），不引入新 crate。
x509-parser = "0.18"
# 证书有效期计算：rcgen 已用 time 0.3，直接声明可统一版本、不新增 crate。
time = "0.3"
# 加权随机的均匀采样。fastrand 零依赖、专为这种场景设计，比手写 xorshift 可靠。
fastrand = "2"
# 共享四线程运行时、异步 socket、计时与并发名额，不启用 full 或宏。
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
# HTTP/1.1 客户端/服务端、消息定界和 CONNECT 缓冲移交；不启用 HTTP/2。
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
# Hyper 与 Tokio I/O、计时器的官方适配层。
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Empty/Full/流式正文适配与 Bytes 缓冲；不整体缓存安装包。
http-body-util = "0.1.5"
bytes = "1.12.1"
# 复用现有 rustls 配置与 ring 后端，把 TLS 握手/流接入 Tokio。
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# 复用成熟超时计时器；薄 I/O 适配层在另一方向有字节进展时重置等待期限。
tokio-io-timeout = "1.2.1"

[dev-dependencies]
# Virtual time exercises connection idle deadlines without minute-long unit tests.
tokio = { version = "1.54.1", features = ["test-util"] }
# Evaluate generated PAC with Windows' own engine; no registry/system proxy edits.
windows-sys = { version = "0.61", features = ["Win32_Networking_WinHttp"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true









