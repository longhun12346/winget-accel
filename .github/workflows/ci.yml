name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy（警告即失败）
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --all-targets

      - name: 构建 release
        run: cargo build --release

      - name: 产物信息
        run: |
          $exe = "target\release\winget-accel.exe"
          $f = Get-Item $exe
          "大小: {0:N0} B" -f $f.Length
          "SHA256: " + (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          & $exe --version
          & $exe --print-pac

  protocol:
    name: 协议用例（Python 驱动二进制）
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pytest 与 cryptography
        run: python -m pip install --disable-pip-version-check pytest cryptography

      - name: 协议用例（无网、不改系统状态）
        working-directory: prototype
        run: python -m pytest tests --target-binary "${{ github.workspace }}\target\release\winget-accel.exe" -q
